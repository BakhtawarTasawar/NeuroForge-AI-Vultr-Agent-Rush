services:
  neuroforge-postgres:
    image: postgres:16-alpine
    container_name: neuroforge-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5440:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuroforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-neuroforge_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - neuroforge_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-neuroforge.sh:/docker-entrypoint-initdb.d/01-init-neuroforge.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neuroforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Qdrant Persistent Vector Database (Scientific Knowledge & Semantic RAG)
  # =============================================================================
  neuroforge-qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: neuroforge-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - neuroforge_qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  neuroforge_postgres_data:
    name: neuroforge_postgres_data
  neuroforge_qdrant_data:
    name: neuroforge_qdrant_data
